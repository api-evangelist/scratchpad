note: >-
  Scratchpad runs a real Statuspage with per-component granularity, and it is the single strongest
  operational signal the company publishes. There is no versioning policy, no deprecation policy, no
  Sunset/Deprecation header commitment and no published SLA - each recorded as absent below rather
  than omitted.

