versioning:
  scheme: none
  current: null
  docs: null
  note: >-
    The MCP endpoint is https://mcp.clearskies.cc/mcp with no version segment and no documented
    version header. MCP protocol version negotiation is part of the initialize handshake and is
    behind authentication.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  note: >-
    No deprecation or sunset policy is published on scratchpad.com or clearskies.cc. NO Deprecation
    pointer is emitted in apis.yml. The closest published lifecycle commitment is product-level -
    Clearskies marks each connector live, beta or roadmap on
    https://clearskies.cc/integrations - which is a maturity signal, not a deprecation contract.

