note: >-
  There is no sandbox in the payments sense - no test-mode key prefix, no test/live separation, no
  magic test identifiers, and no fixture values are published. What Clearskies does ship is a genuine
  non-destructive execution mode for the thing an agent is most likely to break: workflows that write
  to a CRM or send email. Recorded verbatim from the docs. Nothing here is invented.

