test_facilities:
- id: workflow-dry-run
  name: Dry run a workflow draft
  description: >-
    Run a draft against real trigger data and inspect what each step would do. Quoted from the docs:
    "Test runs never produce side effects: no Slack message or email is sent, and nothing is written
    to your CRM."
  reachable_over_mcp: true
  source: https://clearskies.cc/docs/workflows/manage-via-mcp.md
- id: workflow-validate
  name: Validate a draft
  description: Validate a draft and get back per-step errors to fix, before anything goes live.
  reachable_over_mcp: true
  source: https://clearskies.cc/docs/workflows/manage-via-mcp.md
- id: draft-publish-model
  name: Draft-and-publish isolation
  description: >-
    Creating a workflow always creates a draft and nothing runs until it is published. Editing a
    published workflow writes to its draft while the live configuration keeps running; publish again
    to roll out, or discard the draft to revert.
  reachable_over_mcp: true
  source: https://clearskies.cc/docs/workflows/manage-via-mcp.md
- id: human-review-step
  name: Human review gate
  description: Pause a workflow for approval before an action runs; one reviewer decides whether the
    step goes ahead.
  reachable_over_mcp: false
  source: https://clearskies.cc/docs/workflows/human-review.md
