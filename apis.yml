apis:
- name: Clearskies MCP Server
  description: 'The Clearskies Customer Context Graph exposed as a single remote Model Context Protocol
    server. Connected AI clients (Claude, ChatGPT, Cursor, n8n, Retool) query unified, identity-resolved
    customer context across Salesforce, HubSpot, Gong, Scratchpad, Fathom, Granola, Gmail, Outlook,
    Google and Outlook calendars, Slack, Linear, Jira and Pylon, search the CRM schema, and author,
    validate, dry-run, publish and inspect Clearskies workflows and agents. The endpoint is protected
    by OAuth 2.1 (authorization_code + refresh_token, PKCE S256, RFC 7591 dynamic client registration)
    and advertises RFC 9728 protected-resource metadata; tools/list is auth-gated, so the live tool
    schemas require an authenticated introspection.'
  humanURL: https://clearskies.cc/docs/building-with-clearskies/mcp-server
  baseURL: https://mcp.clearskies.cc/mcp
