aid: scratchpad
name: Scratchpad
description: 'Scratchpad is an AI-powered workspace for sales teams that sits on top of Salesforce,
  reducing the friction of keeping the CRM up to date. Reps manage notes, opportunities, tasks, and
  pipeline from a fast, lightweight interface that syncs everything back to Salesforce, with AI-native
  sheets and Kanban boards, an AI notetaker and call recorder, automated field updates, executive
  summaries, and CRM hygiene monitoring. The product connects to Salesforce via API and inherits its
  permissions and guardrails, and integrates with Slack, Zoom, and Gong. Founded in 2019 by Pouyan
  Salehi and Cyrus Karbassiyoon in San Francisco, and backed by Accel and Craft Ventures. Scratchpad
  does not publish its own public developer API; it is a Salesforce-native application. This profile
  captures its identity, commercial surface, and security posture for the API Evangelist network.'
